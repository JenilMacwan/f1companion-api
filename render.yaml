services:
  - type: web
    name: f1-companion-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FIREBASE_CREDENTIALS_PATH
        # Render doesn't allow file uploads directly in the free tier easily.
        # A common trick is to store the JSON string in an env var (e.g., FIREBASE_JSON)
        # and parse it, but for now, we'll leave this empty for you to configure in the dashboard.
        value: ""
